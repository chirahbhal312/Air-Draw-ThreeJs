<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Advanced Paint App</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #toolbar {
      background: #444;
      color: #fff;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    #toolbar select,
    #toolbar button,
    #toolbar input[type="color"] {
      font-size: 1rem;
      padding: 6px 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #toolbar button {
      background: #666;
      color: #fff;
    }
    #toolbar button.active {
      box-shadow: inset 0 0 4px #000;
    }
    canvas {
      flex: 1;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <label><input type="color" id="colorPicker" value="#000000" /></label>
    <label>
      Brush Size:
      <select id="brushSize">
        <option>4</option><option>8</option><option>12</option>
        <option>20</option><option>30</option><option>50</option>
      </select>
    </label>
    <label>
      Brush Type:
      <select id="brushType">
        <option value="round">Round</option>
        <option value="square">Square</option>
        <option value="calligraphy">Calligraphy</option>
      </select>
    </label>
    <button id="shapeLine">Line</button>
    <button id="shapeRect">Rectangle</button>
    <button id="shapeCircle">Circle</button>
    <button id="eraser">Eraser</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="save">Save</button>
  </div>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const toolbar = document.getElementById('toolbar');
    const colorPicker = document.getElementById('colorPicker');
    const brushSize = document.getElementById('brushSize');
    const brushType = document.getElementById('brushType');
    const shapeLine = document.getElementById('shapeLine');
    const shapeRect = document.getElementById('shapeRect');
    const shapeCircle = document.getElementById('shapeCircle');
    const eraserBtn = document.getElementById('eraser');
    const undoBtn = document.getElementById('undo');
    const clearBtn = document.getElementById('clear');
    const saveBtn = document.getElementById('save');

    let currentTool = 'brush';
    let drawing = false;
    let startX, startY;
    const actions = [];

    function resize() {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - toolbar.offsetHeight;
      ctx.putImageData(imgData, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function applySettings() {
      ctx.strokeStyle = (currentTool === 'eraser') ? '#fff' : colorPicker.value;
      ctx.lineWidth = brushSize.value;
      ctx.lineCap = brushType.value === 'round' ? 'round' : 'butt';
      ctx.lineJoin = 'round';
    }

    colorPicker.addEventListener('change', applySettings);
    brushSize.addEventListener('change', applySettings);
    brushType.addEventListener('change', applySettings);

    function setActive(btn) {
      [...toolbar.querySelectorAll('button')].forEach(b => b.classList.remove('active'));
      btn && btn.classList.add('active');
    }

    shapeLine.onclick = () => (currentTool = 'line', setActive(shapeLine));
    shapeRect.onclick = () => (currentTool = 'rect', setActive(shapeRect));
    shapeCircle.onclick = () => (currentTool = 'circle', setActive(shapeCircle));
    eraserBtn.onclick = () => (currentTool = 'eraser', setActive(eraserBtn));
    clearBtn.onclick = () => (ctx.clearRect(0,0,canvas.width,canvas.height), actions.length = 0);
    undoBtn.onclick = () => {
      if (!actions.length) return;
      actions.pop();
      ctx.clearRect(0,0,canvas.width,canvas.height);
      actions.forEach(img => ctx.putImageData(img, 0,0));
    };
    saveBtn.onclick = () => {
      const link = document.createElement('a');
      link.download = 'drawing.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    };

    function saveState() {
      actions.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      if (actions.length > 20) actions.shift();
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const pt = e.touches ? e.touches[0] : e;
      return { x: pt.clientX - rect.left, y: pt.clientY - rect.top };
    }

    function start(e) {
      e.preventDefault();
      saveState();
      drawing = true;
      const pos = getPos(e);
      startX = pos.x; startY = pos.y;
      if (currentTool === 'brush' || currentTool === 'eraser') {
        applySettings();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }
    }

    function draw(e) {
      if (!drawing) return;
      const pos = getPos(e);
      if (currentTool === 'brush' || currentTool === 'eraser') {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      } else {
        ctx.putImageData(actions[actions.length - 1], 0, 0);
        applySettings();
        ctx.beginPath();
        if (currentTool === 'line') {
          ctx.moveTo(startX, startY);
          ctx.lineTo(pos.x, pos.y);
        }
        if (currentTool === 'rect') {
          ctx.rect(startX, startY, pos.x - startX, pos.y - startY);
        }
        if (currentTool === 'circle') {
          const r = Math.hypot(pos.x - startX, pos.y - startY);
          ctx.arc(startX, startY, r, 0, Math.PI * 2);
        }
        ctx.stroke();
      }
    }

    function end(e) {
      if (!drawing) return;
      drawing = false;
      if (currentTool !== 'brush' && currentTool !== 'eraser') {
        draw(e);
      }
      ctx.closePath();
    }

    ['mousedown','touchstart'].forEach(evt => canvas.addEventListener(evt, start));
    ['mousemove','touchmove'].forEach(evt => canvas.addEventListener(evt, draw));
    ['mouseup','mouseleave','touchend'].forEach(evt => canvas.addEventListener(evt, end));
  </script>
</body>
</html>
