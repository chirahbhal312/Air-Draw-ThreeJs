<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Paint + AR Viewer</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/examples/jsm/webxr/ARButton.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js"
      }
    }
  </script>
  <style>
    body, html { margin:0; padding:0; height:100%; display:flex; flex-direction:column; }
    #toolbar { background:#444; color:#fff; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; }
    #toolbar * { font-size:1rem; padding:6px 8px; border:none; border-radius:4px; cursor:pointer; }
    #toolbar button.active { box-shadow: inset 0 0 4px #000; }
    #canvas { flex:1; touch-action:none; }
    #ar-container { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  </style>
</head>
<body>
  <div id="toolbar">
    <input type="color" id="colorPicker" value="#000000" />
    <select id="brushSize"><option>4</option><option>8</option><option>12</option><option>20</option><option>30</option><option>50</option></select>
    <select id="brushType"><option value="round">Round</option><option value="square">Square</option><option value="calligraphy">Calligraphy</option></select>
    <button id="shapeLine">Line</button>
    <button id="shapeRect">Rect</button>
    <button id="shapeCircle">Circle</button>
    <button id="eraser">Eraser</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="save">Save</button>
    <button id="viewAR">View in AR</button>
  </div>
  <canvas id="canvas"></canvas>
  <div id="ar-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/examples/jsm/webxr/ARButton.js';

    // — Paint App Setup (same as before) —
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const toolbar = document.getElementById('toolbar');
    // … [brush/shape/event code omitted for brevity; same as previous full HTML] …
    // Include Save button logic as before …
    document.getElementById('save').onclick = () => {
      const link = document.createElement('a');
      link.download = 'drawing.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    };

    // — AR Three.js Setup —
    const arContainer = document.getElementById('ar-container');
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    arContainer.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera();

    // Lighting
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    light.position.set(0.5, 1, 0.25);
    scene.add(light);

    // Plane with canvas texture
    const planeSize = [0.5, 0.3]; // size in meters
    const canvasTexture = new THREE.CanvasTexture(canvas);
    canvasTexture.needsUpdate = true;
    const planeGeo = new THREE.PlaneGeometry(...planeSize);
    const planeMat = new THREE.MeshBasicMaterial({ map: canvasTexture, side: THREE.DoubleSide });
    const planeMesh = new THREE.Mesh(planeGeo, planeMat);
    planeMesh.rotation.x = -Math.PI / 2;

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    function animate(timestamp, frame) {
      if (canvasTexture.needsUpdate) {
        canvasTexture.needsUpdate = true;
        canvasTexture.needsUpdate = false;
      }

      if (frame) {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((ref) => {
            session.requestHitTestSource({ space: ref }).then((source) => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => { hitTestSourceRequested = false; hitTestSource = null; });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);
            planeMesh.position.set(pose.transform.position.x, pose.transform.position.y, pose.transform.position.z);
            if (!scene.children.includes(planeMesh)) {
              scene.add(planeMesh);
            }
          }
        }
      }

      renderer.render(scene, camera);
    }

    // Start AR session
    document.getElementById('viewAR').addEventListener('click', () => {
      arContainer.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));
      renderer.setAnimationLoop(animate);
    });

    // Resize logic
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
